# 送る天気図の「並び」。ここを書き換えるだけで、送る図と順番が変わる。
# 1ページ = 1枚の画像 = LINE の吹き出し1つ(LINE は文字1つ＋画像4枚まで。5ページ目以降はメールとページだけ)。
# cols = 横に並べる枚数。charts は左上から右へ、行が埋まったら次の行。
# 使える図の名前は charts.py の CATALOG(下にも一覧)。
# type: matrix のページは、数値予報図をパネルに切り分けて「予想時間を横・高さの層を縦」の表にする。
#   cells の "FXFE502.1" は FXFE502 の1番目のパネル(上の行→下の行、左→右の順。FXFE507・577 は 1=上段 2=下段)。
#   "ASAS" のように番号なしは図全体。null は空きマス。ft は列ごとの予想時間(0 = 実況)。cell_w は1マスの幅(px)。
#   {cell: FXJP854.1, ft: 12, prev: true} は「1つ前の初期値の T=12」(今の実況と同じ時刻の予想)。
# highlight に書いた図は赤い太枠で囲む。
#   地上: ASAS(最新) ASAS_obs(高層の実況と同じ時刻) ASAS_12h_ago ASAS_24h_ago FSAS24 FSAS48
#   高層実況: AUPA20 AUPQ35 AUPQ78 AXFE578
#   数値予報: FUPA302 FXFE502 FXFE504 FXFE507 FXFE5782 FXFE5784 FXFE577 FXJP854
# 送る時刻は .github/workflows/send.yml の cron(UTC) で決める。

pages:
  - title: 地上天気図(24時間前 → 24時間後)
    cols: 4
    highlight: [ASAS]
    charts: [ASAS_24h_ago, ASAS_12h_ago, ASAS, FSAS24]

  - title: 実況天気図(200hPa → 地上)
    type: matrix
    ft: [0]
    cell_w: 1400
    rows:
      - label: 200hPa 高度・気温・風・圏界面
        cells: [AUPA20]
      - label: 300hPa 高度・気温・等風速線
        cells: [AUPQ35.1]
      - label: 500hPa 高度・気温
        cells: [AUPQ35.2]
      - label: 700hPa 高度・気温・湿数
        cells: [AUPQ78.1]
      - label: 850hPa 高度・気温・湿数
        cells: [AUPQ78.2]
      - label: 地上
        cells: [ASAS_obs]
      - label: 850hPa 相当温位・風(1つ前の初期値の12時間予想 = 実況と同じ時刻)
        cells: [{cell: FXJP854.1, ft: 12, prev: true}]

  - title: 数値予報天気図(予想 12〜48時間)
    type: matrix
    ft: [12, 24, 36, 48]
    rows:
      - label: 500hPa 高度・渦度
        cells: [FXFE502.1, FXFE502.2, FXFE504.1, FXFE504.2]
      - label: 700hPa 湿数(500hPa 気温)
        cells: [FXFE5782.1, FXFE5782.2, FXFE5784.1, FXFE5784.2]
      - label: 850hPa 気温・風(700hPa 鉛直流)
        cells: [FXFE5782.3, FXFE5782.4, FXFE5784.3, FXFE5784.4]
      - label: 地上 気圧・降水量
        cells: [FXFE502.3, FXFE502.4, FXFE504.3, FXFE504.4]
      - label: 850hPa 相当温位・風
        cells: [FXJP854.1, FXJP854.2, FXJP854.3, FXJP854.4]
